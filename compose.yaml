x-app: &app
  build: .
  environment: &env
    DATABASE_URL: postgresql://dedup:dedup@postgres:5432/dedup
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://dedup:dedup@rabbitmq:5672/%2F
    DEDUP_WINDOW_SECONDS: ${DEDUP_WINDOW_SECONDS:-3600}
    LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dedup
      POSTGRES_PASSWORD: dedup
      POSTGRES_DB: dedup
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dedup"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dedup
      RABBITMQ_DEFAULT_PASS: dedup
    ports: ["127.0.0.1:15672:15672"]
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  init:
    <<: *app
    command: [python, -m, app.db]
    restart: "no"
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
  publisher:
    <<: *app
    command: [python, -m, app.services, publisher]
    depends_on:
      init: {condition: service_completed_successfully}
  worker:
    <<: *app
    command: [python, -m, app.services, worker]
    depends_on:
      init: {condition: service_completed_successfully}
  consumer:
    <<: *app
    command: [python, -m, app.services, consumer]
    depends_on:
      init: {condition: service_completed_successfully}
  maintenance:
    <<: *app
    command: [python, -m, app.services, maintenance]
    depends_on:
      init: {condition: service_completed_successfully}
  tests:
    <<: *app
    environment:
      <<: *env
      DATABASE_URL: postgresql://dedup:dedup@postgres:5432/dedup_tests
      REDIS_URL: redis://redis:6379/1
      QUEUE_PREFIX: test-
    profiles: [test]
    command: [python, -m, pytest, -q]
    restart: "no"
    depends_on:
      init: {condition: service_completed_successfully}
volumes:
  postgres-data:
  redis-data:
  rabbit-data:
